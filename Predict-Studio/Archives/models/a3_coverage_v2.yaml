# Approach 3 — soft coverage labels, v2.
# This file is the missing half of best_model.pth. Nothing in the checkpoint
# records the HU window, the spacing, the ROI, or that its output is a coverage
# fraction rather than a binary mask.

id: a3-coverage-v2
name: Approach 3 — soft coverage (v2)
framework: monai

weights: approach3_coverage_v2/best_model.pth     # relative to models_root
sha256:                                           # run inspect_checkpoint.py

output:
  type: soft
  semantics: coverage_fraction

requires:
  hu_window: [0, 1200]
  spacing_mm: [0.37, 0.37, 3.0]
  orientation: RAS
  roi: heart
  roi_margin_mm: 8
  min_slices: 32

inference:
  patch_size: [96, 96, 32]
  sw_overlap: 0.5
  sw_batch_size: 1

architecture:
  in_channels: 1
  out_channels: 1
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.1

trained_on: gated cardiac CT, 3.0 mm, 120 kVp, non-contrast (Stanford COCA)

declared_metrics:
  val_dice_mean: 0.7227
  best_epoch: 140
  loss: TverskyLoss(alpha=0.3, beta=0.7)
