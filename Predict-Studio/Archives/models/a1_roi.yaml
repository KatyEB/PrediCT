# Approach 3 — soft coverage labels, v2.
# This file is the missing half of best_model.pth. Nothing in the checkpoint
# records the HU window, the spacing, the ROI, or that its output is a coverage
# fraction rather than a binary mask.

id: a1-roi
name: Approach 1 — binary, ROI-cropped
framework: monai

weights: approach1_roi_cropped/best_model.pth     # relative to models_root
sha256:                                           # run inspect_checkpoint.py

output:
  type: binary
  semantics: calcium_mask

requires:
  hu_window: [0, 1200]
  spacing_mm: [0.37, 0.37, 3.0]
  orientation: RAS
  roi: heart
  roi_margin_mm: 8
  min_slices: 32

inference:
  patch_size: [96, 96, 32]
  sw_overlap: 0.5
  sw_batch_size: 1

architecture:
  in_channels: 1
  out_channels: 1
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.1

trained_on: gated cardiac CT, 3.0 mm, 120 kVp, non-contrast (Stanford COCA)

declared_metrics:
  val_dice_mean: 0.7100
  best_epoch: 0
  loss: TverskyLoss(alpha=0.3, beta=0.7)
