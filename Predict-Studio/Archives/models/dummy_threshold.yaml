# A model-shaped stand-in that needs no torch and no checkpoint.
# Thresholds raw HU at 130. Not a segmentation model — it exists so the
# pipeline, CLI, API and UI can be tested before a real checkpoint is wired in.

id: dummy-hu130
name: HU threshold (no model)
framework: dummy

weights: none
output:
  type: binary
  semantics: calcium_mask

requires:
  hu_window: [0, 1200]
  orientation: RAS
  roi: none
  min_slices: 4

inference:
  threshold_hu: 130

trained_on: nothing — this is a fixed threshold, for plumbing tests only
