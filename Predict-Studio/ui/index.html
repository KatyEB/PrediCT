<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrediCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Reading-room dark. Not a style choice: a bright surround destroys the
   perception of low-contrast lesions, which is the whole job of this screen. */
:root{
  --image:#08090A;         /* image panel — as close to black as is usable */
  --panel:#141517;         /* data panel — lifted just enough to separate */
  --line:#232529;
  --ink:#E8E9EB;
  --ink-dim:#8A8F98;
  --ink-faint:#5A5F68;
  --ember:#E8743B;         /* predictions */
  --cyan:#3BB9E8;          /* ground truth */
  --warn:#D9A441;
  --stop:#D9534F;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--image);color:var(--ink);font:14px/1.5 var(--sans);
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---- top bar ---- */
header{display:flex;align-items:center;gap:20px;padding:0 16px;height:46px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{font:600 15px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--ember)}
header input{background:var(--image);border:1px solid var(--line);color:var(--ink);
  font:12px var(--mono);padding:6px 9px;border-radius:2px;width:340px}
header input:focus{outline:none;border-color:var(--ember)}
button{background:transparent;border:1px solid var(--line);color:var(--ink);
  font:500 12px var(--sans);padding:6px 13px;border-radius:2px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ember);color:var(--ember)}
button:disabled{opacity:.35;cursor:default}
button.go{background:var(--ember);border-color:var(--ember);color:#0D0906;font-weight:500}
button.go:hover:not(:disabled){filter:brightness(1.12);color:#0D0906}

/* ---- layout ---- */
main{flex:1;display:grid;grid-template-columns:210px 1fr 320px;min-height:0}
aside,.side{background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
aside{border-right:1px solid var(--line)}
.side{border-left:1px solid var(--line)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h2{font:600 10px/1 var(--cond);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:10px}

/* ---- lists ---- */
.item{padding:7px 9px;border:1px solid transparent;border-radius:2px;cursor:pointer;
  font:12px var(--mono);color:var(--ink-dim);margin-bottom:3px}
.item:hover{background:var(--image)}
.item.on{background:var(--image);border-color:var(--ember);color:var(--ink)}
.item .sub{font:10px var(--sans);color:var(--ink-faint);margin-top:2px}
.item.off{opacity:.4;cursor:default}
label.chk{display:flex;align-items:center;gap:7px;padding:6px 0;
  font:12px var(--mono);color:var(--ink-dim);cursor:pointer}
label.chk input{accent-color:var(--ember)}

/* ---- viewer ---- */
.viewer{display:flex;flex-direction:column;background:var(--image);min-width:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  min-height:0;padding:14px}
canvas{image-rendering:pixelated;max-width:100%;max-height:100%;
  box-shadow:0 0 0 1px var(--line)}
.empty{color:var(--ink-faint);font:12px var(--mono);text-align:center;line-height:2}
.hud{position:absolute;top:18px;left:18px;font:11px var(--mono);color:var(--ink-dim);
  pointer-events:none}
.hud b{color:var(--ink);font-weight:500}

/* ---- controls ---- */
.ctrl{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px;
  display:flex;flex-direction:column;gap:9px;flex:none}
.row{display:flex;align-items:center;gap:11px;font:11px var(--mono);color:var(--ink-dim)}
.row label{width:64px;flex:none;color:var(--ink-faint)}
.row output{width:58px;text-align:right;color:var(--ink)}
input[type=range]{flex:1;accent-color:var(--ember);height:3px}

/* SIGNATURE: the window/level track is marked at the Agatston density-factor
   steps, so the control reads as a calibrated instrument rather than a slider.
   Those four numbers are the whole biomarker. */
.ramp{display:flex;height:15px;border:1px solid var(--line);border-radius:2px;
  overflow:hidden;font:9px/15px var(--mono);text-align:center;color:#0D0906}
.ramp div{flex:1}
.ramp .f1{background:#4A3527}.ramp .f2{background:#8A5232}
.ramp .f3{background:#C0663A;color:#0D0906}.ramp .f4{background:var(--ember)}
.ramp-key{display:flex;font:9px var(--mono);color:var(--ink-faint);margin-top:-4px}
.ramp-key div{flex:1;text-align:center}

/* ---- score ---- */
.score{font:500 40px/1 var(--mono);letter-spacing:-.02em}
.risk{display:inline-block;font:11px var(--mono);padding:3px 9px;border-radius:2px;
  margin-top:9px;border:1px solid}
.r0{color:var(--ink-dim);border-color:var(--line)}
.r1{color:#7FB069;border-color:#3A4A32}
.r2{color:var(--warn);border-color:#4A3F22}
.r3{color:var(--stop);border-color:#4A2828}
dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font:11px var(--mono);
  margin-top:14px}
dt{color:var(--ink-faint)}
dd{text-align:right;color:var(--ink-dim)}

/* ---- ledger ---- */
table{width:100%;border-collapse:collapse;font:11px var(--mono)}
th{text-align:left;font:600 9px var(--cond);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);padding:5px 6px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel)}
td{padding:4px 6px;border-bottom:1px solid var(--line);color:var(--ink-dim)}
tr[data-slice]{cursor:pointer}
tr[data-slice]:hover td{background:var(--image);color:var(--ink)}
tr.out td{color:var(--ink-faint);font-style:italic}
.num{text-align:right}

/* ---- messages ---- */
.msg{font:11px/1.6 var(--mono);padding:8px 10px;border-radius:2px;margin-top:9px;
  border-left:2px solid}
.msg.warn{background:#1C1710;border-color:var(--warn);color:#D9BC84}
.msg.stop{background:#1C1010;border-color:var(--stop);color:#D99A98}
.bar{height:2px;background:var(--line);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--ember);transition:width .25s}
</style>
</head>
<body>

<header>
  <div class="brand">Predi<span>CT</span></div>
  <input id="folder" placeholder="folder of DICOM or NIfTI, any depth" spellcheck="false">
  <button id="scan">Load folder</button>
  <button id="run" class="go" disabled>Score</button>
  <div style="flex:1"></div>
  <button id="csv">results.csv</button>
</header>

<main>
  <aside>
    <div class="sec">
      <h2>Studies</h2>
      <div id="studies"><div class="empty" style="text-align:left">none loaded</div></div>
    </div>
    <div class="sec">
      <h2>Models</h2>
      <div id="models"></div>
    </div>
    <div class="sec">
      <h2>Scoring</h2>
      <label class="chk"><input type="checkbox" id="legacy"> legacy (no min-lesion rule)</label>
      <label class="chk"><input type="checkbox" id="d3"> 3D lesions</label>
      <label class="chk"><input type="checkbox" id="force"> override the gate</label>
    </div>
    <div class="sec" id="jobbox" style="display:none">
      <h2>Job</h2>
      <div id="jobtext" style="font:11px var(--mono);color:var(--ink-dim)"></div>
      <div class="bar"><i id="jobbar" style="width:0"></i></div>
    </div>
  </aside>

  <div class="viewer">
    <div class="stage">
      <canvas id="cv" width="512" height="512"></canvas>
      <div class="hud" id="hud"></div>
      <div class="empty" id="blank">
        load a folder to begin<br>
        <span style="color:var(--ink-faint);opacity:.6">DICOM is found by content, not by file extension</span>
      </div>
    </div>
    <div class="ctrl">
      <div class="row">
        <label>slice</label>
        <input type="range" id="slice" min="0" max="0" value="0">
        <output id="sliceout">–</output>
      </div>
      <div class="row">
        <label>overlay</label>
        <input type="range" id="alpha" min="0" max="100" value="55">
        <output id="alphaout">55%</output>
      </div>
      <div class="row">
        <label>window</label>
        <input type="range" id="win" min="200" max="3000" value="1200" step="50">
        <output id="winout">1200</output>
      </div>
      <div class="row">
        <label>level</label>
        <input type="range" id="lev" min="-200" max="1200" value="300" step="10">
        <output id="levout">300</output>
      </div>
      <div class="ramp">
        <div class="f1">1</div><div class="f2">2</div><div class="f3">3</div><div class="f4">4</div>
      </div>
      <div class="ramp-key">
        <div>130</div><div>200</div><div>300</div><div>400+ HU</div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="sec">
      <h2>Agatston</h2>
      <div class="score" id="agat">–</div>
      <div id="risk"></div>
      <dl id="detail"></dl>
      <div id="notes"></div>
    </div>
    <div class="sec" style="flex:1;min-height:0;overflow-y:auto">
      <h2>Lesions</h2>
      <table>
        <thead><tr><th>#</th><th>slice</th><th class="num">mm²</th>
          <th class="num">HU</th><th class="num">f</th><th class="num">score</th></tr></thead>
        <tbody id="ledger"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const API = '';

// ---- state. Small enough to hold in one object and read at a glance. ----
const S = {studies:[], models:[], study:null, model:null, slice:0, mask:null};

// ---- server ----
async function get(p){const r = await fetch(API+p); if(!r.ok) throw new Error((await r.json()).detail||r.statusText); return r.json();}
async function post(p,b){const r = await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  if(!r.ok) throw new Error((await r.json()).detail||r.statusText); return r.json();}

async function plane(url){
  const r = await fetch(API+url); if(!r.ok) return null;
  const [h,w] = r.headers.get('X-Shape').split(',').map(Number);
  return {h, w, data:new Uint8Array(await r.arrayBuffer())};
}

// ---- drawing. Greyscale base, ember overlay composited on top so opacity
//      changes never refetch either layer. ----
async function draw(){
  if(!S.study) return;
  const base = await plane(`/api/studies/${S.study.study_id}/slice/${S.slice}?window=${$('win').value}&level=${$('lev').value}`);
  if(!base) return;

  const cv = $('cv'), cx = cv.getContext('2d');
  cv.width = base.w; cv.height = base.h;
  const img = cx.createImageData(base.w, base.h);

  let over = null;
  if(S.mask){
    over = await plane(`/api/studies/${S.study.study_id}/mask/${S.model}/${S.slice}`);
  }
  const a = +$('alpha').value / 100;

  for(let i=0;i<base.data.length;i++){
    let r = base.data[i], g = r, b = r;
    if(over && over.data[i] > 0){
      const t = (over.data[i]/255) * a;
      r = r*(1-t) + 232*t;   // --ember
      g = g*(1-t) + 116*t;
      b = b*(1-t) +  59*t;
    }
    img.data[i*4] = r; img.data[i*4+1] = g; img.data[i*4+2] = b; img.data[i*4+3] = 255;
  }
  cx.putImageData(img, 0, 0);

  $('hud').innerHTML = `<b>${S.study.patient_id}</b><br>slice ${S.slice+1} / ${S.study.shape[0]}` +
    (S.model ? `<br>${S.model}` : '');
}

// ---- panels ----
function renderStudies(){
  $('studies').innerHTML = S.studies.length ? S.studies.map(s =>
    `<div class="item ${S.study&&S.study.study_id===s.study_id?'on':''}" data-s="${s.study_id}">
      ${s.patient_id}
      <div class="sub">${s.shape[0]} slices · ${s.spacing.map(v=>v.toFixed(2)).join(' × ')} mm${
        s.warnings.length ? ` · <span style="color:var(--warn)">${s.warnings.length} warning${s.warnings.length>1?'s':''}</span>`:''}</div>
    </div>`).join('') : '<div class="empty" style="text-align:left">none loaded</div>';

  document.querySelectorAll('[data-s]').forEach(el =>
    el.onclick = () => selectStudy(S.studies.find(s => s.study_id === el.dataset.s)));
}

function renderModels(){
  $('models').innerHTML = S.models.map(m =>
    `<div class="item ${m.ready?'':'off'} ${S.model===m.id?'on':''}" data-m="${m.ready?m.id:''}">
      ${m.id}
      <div class="sub">${m.ready ? m.output_type : 'weights not found'}</div>
    </div>`).join('');

  document.querySelectorAll('[data-m]').forEach(el => {
    if(!el.dataset.m) return;
    el.onclick = () => { S.model = el.dataset.m; renderModels(); loadScore(); };
  });
}

function renderScore(d){
  if(!d){ $('agat').textContent = '–'; $('risk').innerHTML = '';
          $('detail').innerHTML = ''; $('ledger').innerHTML = ''; $('notes').innerHTML = '';
          S.mask = null; return; }

  const s = d.summary;
  $('agat').textContent = s.agatston.toFixed(1);
  const cls = {'0':'r0','1-99':'r1','100-399':'r2','400+':'r3'}[s.risk_category];
  $('risk').innerHTML = `<span class="risk ${cls}">${s.risk_category}</span>`;

  const rows = [
    ['calcium volume', s.calcium_volume_mm3.toFixed(1)+' mm³'],
    ['lesions', s.n_lesions_included],
    ['lesion definition', s['cfg.lesion_definition']],
    ['min lesion area', s['cfg.min_lesion_area_mm2']+' mm²'],
    ['thickness factor', s['cfg.slice_thickness_factor']],
  ];
  if(s.n_lesions_excluded > 0){
    rows.splice(2, 0, ['excluded', `${s.n_lesions_excluded} (${s.excluded_score_if_included.toFixed(1)})`]);
  }
  $('detail').innerHTML = rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  // Exclusions are shown, never silent. A rule you cannot see is a bug.
  $('notes').innerHTML = s.n_lesions_excluded > 0
    ? `<div class="msg warn">${s.n_lesions_excluded} lesion(s) below ${s['cfg.min_lesion_area_mm2']} mm²
       removed ${s.excluded_score_if_included.toFixed(1)} Agatston. They are listed below.</div>` : '';

  $('ledger').innerHTML = d.lesions.map(l =>
    `<tr class="${l.included?'':'out'}" data-slice="${l.slice_index ?? ''}">
      <td>${l.lesion_id}</td><td>${l.slice_index ?? (l.slice_span||[]).join('–')}</td>
      <td class="num">${l.area_mm2.toFixed(2)}</td><td class="num">${l.peak_hu.toFixed(0)}</td>
      <td class="num">${l.density_factor}</td><td class="num">${l.score.toFixed(1)}</td>
    </tr>`).join('');

  document.querySelectorAll('tr[data-slice]').forEach(tr => tr.onclick = () => {
    const z = parseInt(tr.dataset.slice, 10);
    if(!isNaN(z)){ S.slice = z; $('slice').value = z; $('sliceout').textContent = z+1; draw(); }
  });

  S.mask = true;
  draw();
}

// ---- actions ----
function selectStudy(s){
  S.study = s; S.slice = Math.floor(s.shape[0]/2); S.mask = null;
  $('blank').style.display = 'none';
  $('slice').max = s.shape[0]-1; $('slice').value = S.slice;
  $('sliceout').textContent = S.slice+1;
  $('run').disabled = false;

  const warn = s.warnings.filter(w => /contrast|kvp|modality/i.test(w));
  $('notes').innerHTML = warn.map(w => `<div class="msg warn">${w}</div>`).join('');

  renderStudies(); renderScore(null); draw();
}

async function loadScore(){
  if(!S.study || !S.model) return;
  try { renderScore(await get(`/api/studies/${S.study.study_id}/score/${S.model}`)); }
  catch { renderScore(null); }
}

$('scan').onclick = async () => {
  const folder = $('folder').value.trim();
  if(!folder) return;
  $('scan').disabled = true;
  try {
    S.studies = await post('/api/scan', {folder});
    renderStudies();
    if(S.studies.length) selectStudy(S.studies[0]);
  } catch(e){
    $('notes').innerHTML = `<div class="msg stop">${e.message}</div>`;
  }
  $('scan').disabled = false;
};

$('run').onclick = async () => {
  if(!S.study) return;
  const ids = S.models.filter(m => m.ready).map(m => m.id);
  if(!ids.length) return;

  $('run').disabled = true;
  $('jobbox').style.display = 'block';

  const {job_id} = await post('/api/run', {
    study_ids: [S.study.study_id], model_ids: ids,
    legacy: $('legacy').checked,
    lesion_definition: $('d3').checked ? '3d' : '2d',
    force: $('force').checked,
  });

  const poll = setInterval(async () => {
    const j = await get('/api/jobs/'+job_id);
    $('jobtext').textContent = `${j.done} / ${j.total}  ${j.current||''}`;
    $('jobbar').style.width = (j.done/j.total*100)+'%';

    if(j.status !== 'running'){
      clearInterval(poll);
      $('run').disabled = false;
      const bad = j.results.filter(r => r.status !== 'ok');
      if(bad.length){
        $('notes').innerHTML = bad.map(r =>
          `<div class="msg stop"><b>${r.model_id} ${r.status}</b><br>${r.problems.join('<br>')}</div>`).join('');
      }
      const ok = j.results.find(r => r.status === 'ok');
      if(ok){ S.model = ok.model_id; renderModels(); loadScore(); }
      setTimeout(() => $('jobbox').style.display = 'none', 2500);
    }
  }, 400);
};

$('csv').onclick = () => location.href = '/api/results.csv';

['slice','alpha','win','lev'].forEach(id => $(id).oninput = () => {
  if(id === 'slice'){ S.slice = +$('slice').value; $('sliceout').textContent = S.slice+1; }
  if(id === 'alpha') $('alphaout').textContent = $('alpha').value+'%';
  if(id === 'win')   $('winout').textContent = $('win').value;
  if(id === 'lev')   $('levout').textContent = $('lev').value;
  draw();
});

// Arrow keys scrub, because that is how anyone reads a stack.
document.onkeydown = e => {
  if(!S.study) return;
  if(e.key === 'ArrowUp' || e.key === 'ArrowRight') S.slice = Math.min(S.study.shape[0]-1, S.slice+1);
  else if(e.key === 'ArrowDown' || e.key === 'ArrowLeft') S.slice = Math.max(0, S.slice-1);
  else return;
  e.preventDefault();
  $('slice').value = S.slice; $('sliceout').textContent = S.slice+1; draw();
};

get('/api/models').then(m => { S.models = m; renderModels(); });
</script>
</body>
</html>
