experiment:
  id: exp-005
  name: sam2-pericardium

sam2:
  model_id: "facebook/sam2.1-hiera-base-plus"
  device: "mps"
  box_pad: 8          # pixels to pad around heart mask bbox for SAM2 box prompt
  min_heart_vox: 200  # minimum heart voxels in slice to attempt prediction

windowing:
  lo: -160   # mediastinal window (best for pericardium, from exp-003)
  hi: 240

data:
  # Score-1 (clear pericardium) patients from exp-004 scoring
  score1_patients:
